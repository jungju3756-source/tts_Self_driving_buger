# =============================================================================
#  전동휠체어 운전자보조시스템 — 단차(낭떠러지) 감지 모듈 설정
#  3개 프로세스가 이 파일 하나를 공유한다.
#    라파2 : tof_cliff_detector.py  (센서 → 단차 판정)
#    라파2 : cliff_bridge.py        (단차 이벤트 → 회피 지시)
#    라파1 : cliff_guard_node.py    (회피 지시 → 조이스틱 오버라이드)
# =============================================================================

mqtt:
  host: 192.168.0.57          # 브로커 = 라파1 (jungju4, TurtleBot3 Waffle Pi)
  port: 1883
  keepalive: 15
  username: ""                # 인증 안 쓰면 빈 문자열
  password: ""
  topics:
    cliff:   wheelchair/tof/cliff       # detector → bridge
    frame:   wheelchair/tof/frame       # detector → (디버그용 8x8 원본)
    status:  wheelchair/tof/status      # detector 생존 신호 (retained + LWT)
    command: wheelchair/safety/command  # bridge → 라파1

# -----------------------------------------------------------------------------
# 센서 장착 형상
#   좌표계: X=전진, Y=좌측, Z=위  (ROS REP-103)
#   센서는 원점 기준 mount_height_m 높이에 있고, 수평에서 tilt_deg 만큼 아래로
#   기울어져 전방을 본다. 지면은 평면 Z=0 으로 가정한다.
#
#   센서를 3개로 늘릴 때는 이 블록을 sensors: 리스트로 복사하고
#   yaw_deg 만 바꾼 뒤 detector 를 3개 띄우면 된다 (--sensor 인자로 선택).
# -----------------------------------------------------------------------------
sensor:
  id: tof_front
  port: /dev/ttyACM0          # 라파2의 Waveshare RP2350 (ToF Pico)
  baud: 115200
  # 아래 세 값은 tools/fit_mount.py 로 실측 역산한 결과 (잔차 5.0 mm)
  mount_height_m: 0.190       # 지면 ~ 센서 광학중심 높이 [m]
  tilt_deg: 13.8              # 수평 기준 아래쪽으로 기운 각도 (광축 기준)
  yaw_deg: 0.0                # 정면=0, 좌측이 +  (센서 증설용)
  fov_deg: 45.0               # VL53L8CX 8x8 모드 전체 화각
  grid: 8
  row0_is_top: false          # R0 가 아래쪽(가까운 지면)을 본다 — 실측 확인됨
  col0_is_left: true          # C0 열이 로봇 기준 좌측이면 true
  baseline_file: config/ground_baseline.yaml   # --calibrate 결과 저장 위치

# -----------------------------------------------------------------------------
# 단차 판정
# -----------------------------------------------------------------------------
detect:
  # [0] 판정 방식 --------------------------------------------------------------
  #   geometric : 장착 형상(각도·높이) + 평지 기준면으로 '몇 cm 꺼졌나'를 계산.
  #               정확하지만 mount_height_m / tilt_deg 실측과 --calibrate 가 필요하고,
  #               센서를 건드리거나 차체가 기울면 전부 다시 해야 한다.
  #   jump      : 한 프레임 안에서 각 열을 가까운 행 → 먼 행으로 훑다가
  #               거리가 갑자기 jump_ratio 배 넘게 뛰는 지점을 낙차로 본다.
  #               장착값도 기준면도 필요 없다. 대신 깊이(몇 cm)는 알 수 없다.
  #   baseline  : 평지에서 셀마다 '평소 거리'를 외워두고, 그 셀치고 유난히 멀거나
  #               응답이 사라졌을 때만 낙차로 본다. 장착 각도·높이는 몰라도 되고
  #               평지에서 6초 정지(--calibrate 60) 한 번이면 끝난다.
  #               센서가 비틀려 달렸거나 위쪽 행이 지면을 스치듯 보는 상황을
  #               셀별 기준값이 알아서 흡수하므로 오탐이 가장 적다.
  mode: baseline
  # 그 셀 기준거리의 몇 배 이상이면 낙차로 볼지.
  # 1.5 = 평소 30cm 찍는 셀이 45cm 넘게 나오면 지면이 꺼진 것으로 판단.
  base_ratio: 1.5
  jump_ratio: 2.5
  # 직전 지면이 이 거리 안쪽일 때만 급변을 낙차로 인정한다.
  # 배열 위쪽 행은 수평선에 가까워 평지에서도 거리가 몇 배씩 뛰므로,
  # 이 조건이 없으면 멀쩡한 바닥에서 오탐이 난다.
  max_ground_mm: 800
  # [1] 셀 단위 판정 (geometric 모드에서만 사용) --------------------------------
  # 지면보다 이만큼 아래로 꺼져 있으면 그 셀은 '낙차'
  min_cliff_depth_mm: 50
  # 측정거리가 기준 지면거리보다 최소 이만큼은 멀어야 함 (센서 노이즈 하한)
  min_range_excess_mm: 40
  # 캘리브레이션 baseline 이 있을 때, 셀별 표준편차의 몇 배를 문턱에 더할지
  sigma_k: 3.0
  # 기준 지면거리가 이 값을 넘는 행은 판정에서 제외.
  # 현재 장착(광축 13.8°)에서 R5 는 광축각이 5.4° 뿐이라 기대거리가 2.02m 이고,
  # 로봇이 1°만 기울어도 43mm 가 흔들려 오탐원이 된다. R6/R7 은 아예 수평선 위.
  # 1200 으로 잡으면 R0(344mm)~R4(996mm) 40셀만 사용 → 전방 0.29~0.98m 감시.
  max_valid_range_mm: 1200

  # [2] 무응답(----) 셀 처리 ---------------------------------------------------
  # 낭떠러지는 '아무것도 안 잡힘' 으로 나타나는 경우가 많다.
  # 단, 검은 카펫/젖은 바닥도 같은 증상이라 별도의 큰 군집을 요구한다.
  treat_invalid_as_cliff: true
  invalid_min_cluster: 5
  # 평지 캘리브레이션에서 응답률이 이 값 미만이었던 셀은 '무응답 = 낭떠러지'
  # 규칙에서 뺀다. 스침각이 얕은 먼 행은 평지에서도 응답이 자주 끊겨서,
  # 이 걸름망이 없으면 평지에서 오탐이 난다. (값이 돌아올 때의 깊이 판정에는 계속 쓴다)
  blind_min_valid_rate: 0.9

  # [3] 공간 필터 --------------------------------------------------------------
  # 4-이웃으로 연결된 낙차 셀이 이 개수 이상이어야 인정 (단일 픽셀 노이즈 제거)
  min_cluster: 3
  # 로봇 진행 통로의 반폭 [m]. 이 안쪽에 낙차가 있으면 '전방 단차'로 분류
  # Waffle Pi 전폭 0.306 m → 반폭 0.153 + 여유 ≈ 0.20  (Burger 는 0.12 였음)
  center_band_m: 0.20

  # [4] 시간 필터 --------------------------------------------------------------
  window: 5                   # 최근 N 프레임 관찰
  set_votes: 3                # 그중 M개 이상 검출되면 위험 확정 (오탐 억제)
  clear_frames: 8             # 연속 K 프레임 깨끗해야 해제 (히스테리시스)

  # [5] 발행 -------------------------------------------------------------------
  event_hz: 15                # 단차 이벤트 발행 주기
  # 8x8 원본 + 셀별 판정 발행 주기 (0 이면 발행 안 함).
  # tools/tof_web.py 시각화가 이 토픽을 본다. 한 프레임이 1KB 남짓이라
  # 10Hz 라도 10KB/s 밖에 안 된다 — 부담 없이 올려도 된다.
  frame_hz: 10

# -----------------------------------------------------------------------------
# 회피 지시 생성 (cliff_bridge.py)
# -----------------------------------------------------------------------------
command:
  min_stop_s: 1.0             # 전방 단차: 먼저 완전 정지를 유지할 최소 시간
  release_hold_s: 0.5         # 위험 해제 후에도 지시를 유지할 시간
  side_correct_gain: 0.6      # 측면 단차 보정 강도 (0~1) — 라파1이 각속도로 환산
  event_stale_s: 0.5          # 이벤트가 이만큼 끊기면 센서 이상으로 간주
  publish_hz: 10

# -----------------------------------------------------------------------------
# 라파1 오버라이드 (cliff_guard_node.py)
# -----------------------------------------------------------------------------
guard:
  cmd_in: /cmd_vel_manual     # 조이스틱(teleop_twist_joy) 출력
  cmd_out: /cmd_vel           # turtlebot3_node 입력 (TwistStamped)
  state_topic: /cliff/state
  rate_hz: 20
  watchdog_s: 0.6             # 이 시간 동안 지시가 없으면 링크 끊김 처리
  degraded_speed_scale: 0.3   # 센서 이상 시 속도 제한 배율 (정지 대신 감속)
  detour_linear: 0.08         # 우회 주행 전진 속도 [m/s]
  detour_angular: 0.8         # 우회 선회 각속도 [rad/s]
  max_angular: 1.2            # 보정 후 각속도 상한 [rad/s]
  allow_reverse_when_stopped: true   # 정지 상태에서 사용자의 후진 입력은 허용
